[package]
name = "txt"
version = "0.2.4"
description = "Quick notes, one keystroke away"
edition = "2021"
default-run = "txt"
license = "BUSL-1.1"

[lib]
name = "txt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "txt"
path = "src/main.rs"

[[bin]]
name = "txt-mcp"
path = "src/bin/txt-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
rmcp = { version = "1", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal"] }

# Never strip proc-macros (or build scripts). On macOS 27 a stripped
# proc-macro dylib is refused at load time, so rustc reports `can't find crate
# for tauri_macros` and the build fails (seen on the Mac mini, 2026-11-07; the
# same fix as cxmail 9edd632). build-override covers every build-time unit.
[profile.dev.build-override]
strip = "none"

[profile.release.build-override]
strip = "none"
